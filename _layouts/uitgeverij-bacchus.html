---
layout: default
---

<body class="publisher-body">

<header class="publisher-banner">
  <div class="publisher-banner-inner">

    <a
      class="publisher-home-link"
      href="{{ '/' | prepend: site.baseurl }}"
      title="Naar de homepage van TUUR"
      aria-label="Naar de homepage van TUUR">

      <span class="publisher-asterisk-glyph" aria-hidden="true">*</span>

    </a>

  </div>
</header>

<main
  id="main"
  class="publisher-main"
  role="main"
  aria-label="Content">

  <div class="publisher-wrapper">

    <section class="publisher-hero">

      {% if page.bacchus_logo %}
        <img
          class="bacchus-logo"
          src="{{ site.baseurl }}{{ page.bacchus_logo }}"
          alt="Uitgeverij Bacchus">
      {% endif %}

      {% if page.subtitle %}
        <p class="page-intro">
          {{ page.subtitle }}
        </p>
      {% endif %}

    </section>

    <article class="publisher-page">
      {{ content }}
    </article>

      </div>
</main>
<script>
  (() => {
    const desktopMediaQuery = window.matchMedia("(min-width: 641px)");

    function positionPublisherRelease() {
      const release = document.querySelector(".publisher-release");

      if (!release) {
        return;
      }

      /*
       * Verwijder eerst de eerder berekende marge.
       * Anders wordt bij iedere nieuwe meting de oude marge meegerekend.
       */
      release.style.marginTop = "0px";

      /*
       * Op mobiel wordt de positie niet kunstmatig aangepast.
       */
      if (!desktopMediaQuery.matches) {
        return;
      }

      /*
       * Laat hooguit 8 pixels van de witte boekstrook
       * aan de onderkant van het scherm zien.
       */
      const visibleWhiteEdge = 8;
      const naturalTop = release.getBoundingClientRect().top;
      const desiredTop = window.innerHeight - visibleWhiteEdge;
      const requiredMargin = Math.max(0, desiredTop - naturalTop);

      release.style.marginTop = requiredMargin + "px";
    }

    function schedulePositioning() {
      window.requestAnimationFrame(positionPublisherRelease);
    }

    window.addEventListener("load", schedulePositioning);
    window.addEventListener("resize", schedulePositioning);

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(schedulePositioning);
    }

    document
      .querySelectorAll(".publisher-introduction img, .publisher-hero img")
      .forEach((image) => {
        if (!image.complete) {
          image.addEventListener("load", schedulePositioning);
        }
      });
  })();
</script>
<script>
  function centerPublisherCopyBetweenImages() {
    const cover = document.querySelector(".publisher-release-cover img");
    const copy = document.querySelector(".publisher-release-copy");
    const insideImage = document.querySelector(".publisher-release-image img");

    if (!cover || !copy || !insideImage) return;

    if (window.matchMedia("(max-width: 1050px)").matches) {
      copy.style.transform = "none";
      return;
    }

    copy.style.transform = "none";

    const coverRect = cover.getBoundingClientRect();
    const copyRect = copy.getBoundingClientRect();
    const imageRect = insideImage.getBoundingClientRect();

    const targetCenter =
      coverRect.right + (imageRect.left - coverRect.right) / 2;

    const copyCenter =
      copyRect.left + copyRect.width / 2;

    const shift = targetCenter - copyCenter;

    copy.style.transform = `translateX(${shift}px)`;
  }

  window.addEventListener("load", centerPublisherCopyBetweenImages);
  window.addEventListener("resize", centerPublisherCopyBetweenImages);
</script>
