---
layout: default
---

<body class="publisher-body">

<header class="publisher-banner">
  <div class="publisher-banner-inner">

    <div class="publisher-brand">

      <a
        class="publisher-home-link"
        href="{{ '/' | prepend: site.baseurl }}"
        title="Home">

        <img
          id="logo"
          class="publisher-tuur-logo"
          src="{{ site.url }}{{ site.baseurl }}{{ site.logo }}"
          alt="{{ site.title }}">
      </a>

      <a
        id="areah"
        class="publisher-menu-trigger"
        href="#"
        onclick="toggleNav(); return false;"
        title="Menu">

        <span id="asterisk" aria-hidden="true">*</span>
      </a>

    </div>

  </div>
</header>

<main
  id="main"
  class="publisher-main"
  role="main"
  aria-label="Content">

  <div class="publisher-wrapper">

    <section class="publisher-hero">

      {% if page.bacchus_logo %}
        <img
          class="bacchus-logo"
          src="{{ site.baseurl }}{{ page.bacchus_logo }}"
          alt="Uitgeverij Bacchus">
      {% endif %}

      {% if page.subtitle %}
        <p class="page-intro">
          {{ page.subtitle }}
        </p>
      {% endif %}

    </section>

    <article class="publisher-page">
      {{ content }}
    </article>
