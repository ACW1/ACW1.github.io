---
layout: default
---

<body class="publisher-body">

  <header class="publisher-banner">
    <div class="publisher-banner-inner">

      <a
      class="publisher-home-link"
      href="{{ '/' | prepend: site.baseurl }}"
      title="Naar de homepage van TUUR"
      aria-label="Naar de homepage van TUUR">

      <span class="publisher-asterisk-glyph" aria-hidden="true">*</span>

    </a>

  </div>
</header>

<main
id="main"
class="publisher-main"
role="main"
aria-label="Content">

<div class="publisher-wrapper">
 <!--  <div class="publisher-emblem">
  <img
    src="{{ site.baseurl }}/assets/images/uitgeverij-bacchus/Bacchus-presents-3.png"
    alt="Beeldmerk van Uitgeverij Bacchus">
</div> -->
 <figure class="publisher-masthead">
  <img
  src="{{ site.baseurl }}/assets/images/uitgeverij-bacchus/Bacchus-presents-2.png"
  alt="Bacchus presents book">
</figure>

<section class="publisher-hero">

  {% if page.bacchus_logo %}
  <picture class="bacchus-logo-picture">

    <source
    media="(max-width: 640px)"
    srcset="{{ site.baseurl }}/assets/images/uitgeverij-bacchus/Uitgeverij-Bacchus-mobiel-2.png">

    <img
    class="bacchus-logo"
    src="{{ site.baseurl }}{{ page.bacchus_logo }}"
    alt="Uitgeverij Bacchus, Rotterdam">

  </picture>
  {% endif %}

  {% if page.subtitle %}
  <p class="page-intro">
    {{ page.subtitle }}
  </p>
  {% endif %}

</section>

<article class="publisher-page">
  {{ content }}
</article>

</div>
</main>

<script>
  (() => {
    const mobileQuery = window.matchMedia("(max-width: 640px)");
    const stackedQuery = window.matchMedia("(max-width: 1050px)");

   function positionPublisherReleaseAtFold() {
  const release = document.querySelector(".publisher-release");

  if (!release) return;

  release.style.marginTop = "0px";

  /*
   * Op mobiel geen positionering ten opzichte van de vouw.
   * Gewoon 24 px ruimte na de introductietekst.
   */
  if (mobileQuery.matches) {
    release.style.marginTop = "0px";
    return;
  }

  /*
   * Alleen op grotere schermen het boekblok
   * bij de onderkant van het eerste scherm plaatsen.
   */
  const visibleWhiteStrip = 32;

  const naturalDocumentTop =
    release.getBoundingClientRect().top + window.scrollY;

  const desiredDocumentTop =
    window.innerHeight - visibleWhiteStrip;

  const requiredMargin = Math.max(
    0,
    desiredDocumentTop - naturalDocumentTop
  );

  release.style.marginTop = requiredMargin + "px";
}

    function centerPublisherCopyBetweenImages() {
      const cover =
      document.querySelector(".publisher-release-cover img");

      const copy =
      document.querySelector(".publisher-release-copy");

      const insideImage =
      document.querySelector(".publisher-release-image img");

      if (!cover || !copy || !insideImage) return;

      if (stackedQuery.matches) {
        copy.style.transform = "none";
        return;
      }

      copy.style.transform = "none";

      const coverRect = cover.getBoundingClientRect();
      const copyRect = copy.getBoundingClientRect();
      const imageRect = insideImage.getBoundingClientRect();

      const targetCenter =
      coverRect.right +
      (imageRect.left - coverRect.right) / 2;

      const copyCenter =
      copyRect.left + copyRect.width / 2;

      const shift = targetCenter - copyCenter;

      copy.style.transform =
      "translateX(" + shift + "px)";
    }

    function updatePublisherLayout() {
      window.requestAnimationFrame(() => {
        positionPublisherReleaseAtFold();
        centerPublisherCopyBetweenImages();
      });
    }

    window.addEventListener("load", updatePublisherLayout);
    window.addEventListener("resize", updatePublisherLayout);

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(updatePublisherLayout);
    }

    document
    .querySelectorAll(
      ".publisher-masthead img, " +
      ".publisher-hero img, " +
      ".publisher-release img"
      )
    .forEach((image) => {
      if (!image.complete) {
        image.addEventListener("load", updatePublisherLayout);
      }
    });
  })();
</script>
