---
layout: default
---

<body class="publisher-body">

<header class="publisher-banner">
  <div class="publisher-banner-inner">

    <div class="publisher-brand">

      <a
  id="areah"
  class="publisher-menu-trigger"
  href="#"
  onclick="toggleNav(); return false;"
  title="Menu">

  <svg
    class="publisher-asterisk"
    viewBox="0 0 100 100"
    aria-hidden="true"
    focusable="false">

    <line
      x1="22" y1="50"
      x2="78" y2="50"
      stroke="#ffffff"
      stroke-width="7"
      stroke-linecap="round">
    </line>

    <line
      x1="36" y1="26"
      x2="64" y2="74"
      stroke="#ffffff"
      stroke-width="7"
      stroke-linecap="round">
    </line>

    <line
      x1="64" y1="26"
      x2="36" y2="74"
      stroke="#ffffff"
      stroke-width="7"
      stroke-linecap="round">
    </line>

  </svg>
</a>
    </div>

  </div>
</header>

<main
  id="main"
  class="publisher-main"
  role="main"
  aria-label="Content">

  <div class="publisher-wrapper">

    <section class="publisher-hero">

      {% if page.bacchus_logo %}
        <img
          class="bacchus-logo"
          src="{{ site.baseurl }}{{ page.bacchus_logo }}"
          alt="Uitgeverij Bacchus">
      {% endif %}

      {% if page.subtitle %}
        <p class="page-intro">
          {{ page.subtitle }}
        </p>
      {% endif %}

    </section>

    <article class="publisher-page">
      {{ content }}
    </article>
