---
layout: default
---

<body class="publisher-body">

  <main id="main" class="publisher-main" role="main" aria-label="Content">
    <div class="publisher-wrapper">

      <<header class="publisher-banner">
  <div class="publisher-banner-inner">

    <div class="publisher-brand">
      <div class="relative">

        <a id="areah"
           href=""
           onclick="toggleNav(); return false;"
           title="Menu">
          <p id="asterisk">*</p>
        </a>

        <a href="{{ '/' | prepend: site.baseurl }}">
          <img
            id="logo"
            src="{{ site.url }}{{ site.baseurl }}{{ site.logo }}"
            title="Home"
            alt="{{ site.title }}">
        </a>

      </div>
    </div>

  </div>
</header>

<main id="main" class="publisher-main" role="main" aria-label="Content">
  <div class="publisher-wrapper">

    <section class="publisher-hero">
      {% if page.bacchus_logo %}
        <img
          class="bacchus-logo"
          src="{{ site.baseurl }}{{ page.bacchus_logo }}"
          alt="Uitgeverij Bacchus">
      {% endif %}

      {% if page.subtitle %}
        <p class="page-intro">{{ page.subtitle }}</p>
      {% endif %}
    </section>

    <article class="publisher-page">
      {{ content }}
    </article>

    </div>
  </main>
</body>
