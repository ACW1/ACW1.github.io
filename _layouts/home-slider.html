<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'nl' }}">

<head>
  {% include _head.html %}
</head>

<body class="home-slider-page">

  {% include sidebar.html %}

  <main class="tuur-home">

    <section
      class="home-hero"
      aria-label="Mijnheer Pimpelmans heeft alweer pech">

      <nav
        class="home-hero__badges"
        aria-label="Hoofdnavigatie">

        <a
          class="home-hero__badge home-hero__badge--bacchus"
          href="{{ '/uitgeverij-bacchus/' | relative_url }}"
          aria-label="Naar Uitgeverij Bacchus">

          <img
            src="{{ page.bacchus_badge | relative_url }}"
            alt="Uitgeverij Bacchus">

        </a>

        <a
          class="home-hero__badge home-hero__badge--tuur"
          href="{{ '/artikelen/' | relative_url }}"
          aria-label="Naar TUUR en de artikelen">

          <img
            src="{{ page.tuur_badge | relative_url }}"
            alt="TUUR">

        </a>

      </nav>

      <div
        class="home-slider"
        data-home-slider>

        <div
          class="home-slider__viewport"
          data-slider-viewport>

          <div class="home-slider__slides">

            <div
              class="home-slider__slide home-slider__slide--bridge is-active"
              data-slide
              aria-hidden="false">


              <img
                src="{{ '/assets/images/home/28af.png' | relative_url }}"
                alt="Mijnheer Pimpelmans heeft alweer pech als oblong hardcoverboek">

                 <h1>Mijnheer Pimpelmans is terug!</h1>
            </div>

             <div
              class="home-slider__slide home-slider__slide--bridge"
              data-slide
              aria-hidden="true">

              <h1>Helaas heeft hij weer pech...</h1>
              <img
                src="{{ '/assets/images/home/alweer-pech.png' | relative_url }}"
                alt="Mijnheer Pimpelmans heeft alweer pech als oblong hardcoverboek">
            </div>

            <div
              class="home-slider__slide home-slider__slide--spread"
              data-slide
              aria-hidden="true">

              <img
                src="{{ '/assets/images/home/gerrit-rotman.jpg' | relative_url }}"
                alt="De eerste twee afleveringen van Mijnheer Pimpelmans heeft alweer pech">
              <h1>Gerrit Rotmans laatste Pimpelmansverhaal</h1>
            </div>

           <div
              class="home-slider__slide home-slider__slide--title"
              data-slide
              aria-hidden="true">
              <h1>Nu voor het eerst in boekvorm</h1>
              <img
                src="{{ '/assets/images/home/brammetje-flapoor3.png' | relative_url }}"
                alt="Titelpagina van Mijnheer Pimpelmans heeft alweer pech">

            </div>

            <div
              class="home-slider__slide home-slider__slide--book"
              data-slide
              aria-hidden="true">

              <img
                src="{{ '/assets/images/home/pimpelmans-book-mockup-8.png' | relative_url }}"
                alt="Mijnheer Pimpelmans heeft alweer pech als oblong hardcoverboek">

            </div>
 
          </div>

        </div>

      </div>

    </section>

    <section class="home-intro">

      <div class="home-intro__inner">
        {{ content }}
      </div>

    </section>

  </main>

  <script src="{{ site.url }}{{ site.baseurl }}/assets/js/sidebar.js"></script>
  <script src="{{ '/assets/js/home-slider.js' | relative_url }}"></script>

</body>
</html>
